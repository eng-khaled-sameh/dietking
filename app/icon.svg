<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dkGold" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffc8a2"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ee9800"/>
    </linearGradient>
    <linearGradient id="dkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161f36"/>
      <stop offset="100%" stop-color="#0b1326"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#f97316" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#dkBg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#dkGold)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Diet King Crown + Leaf + Fork Emblem -->
  <g filter="url(#glow)">
    <!-- Crown Finial Spheres -->
    <circle cx="32" cy="15.5" r="3" fill="url(#dkGold)"/>
    <circle cx="18" cy="20.5" r="2.5" fill="url(#dkGold)"/>
    <circle cx="46" cy="20.5" r="2.5" fill="url(#dkGold)"/>

    <!-- Crown Peaks Lines -->
    <path d="M18 23 L25 32 L32 18.5 L39 32 L46 23" 
          stroke="url(#dkGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left Leaf Motif -->
    <path d="M15 30 C13 40 22 47 32 49 C26 45 23 37 25 30 C20 30 16 32 15 30 Z" 
          fill="none" stroke="url(#dkGold)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M16 38 C23 39 28 44 32 49" 
          stroke="url(#dkGold)" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Fork Motif -->
    <!-- Fork Tines -->
    <path d="M37 29 L41 33" stroke="url(#dkGold)" stroke-width="2" stroke-linecap="round"/>
    <path d="M40 26 L44 30" stroke="url(#dkGold)" stroke-width="2" stroke-linecap="round"/>
    <path d="M43 23 L47 27" stroke="url(#dkGold)" stroke-width="2" stroke-linecap="round"/>
    <!-- Fork Base & Handle curving down to emblem base -->
    <path d="M42 32 C45 35 48 40 47 44 C45 48 39 49 32 49" 
          stroke="url(#dkGold)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bottom Base Bar -->
    <path d="M22 51 L42 51" stroke="url(#dkGold)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
